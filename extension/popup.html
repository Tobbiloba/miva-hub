<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askly Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon-48.png" alt="" class="logo" width="28" height="28">
    <div class="brand">
      <span class="brand-name">Askly Capture</span>
      <span id="statusPill" class="pill pill-muted" hidden></span>
    </div>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </header>

  <main id="app">
    <!-- Loading -->
    <section id="loadingView" class="center-view" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span class="sr-only">Loading</span>
    </section>

    <!-- Not connected -->
    <section id="connectView" class="hero" hidden>
      <div class="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3Zm-7 9.18v4L12 20l7-3.82v-4L12 16l-7-3.82Z"/></svg>
      </div>
      <h1>Your lessons, in Askly</h1>
      <p>Connect once. Askly then saves the videos, readings and assignments from your LMS courses for you, and keeps up with new ones.</p>
      <button id="connectBtn" class="btn btn-primary btn-block" type="button">Connect to Askly</button>
      <button id="passwordBtn" class="btn btn-link" type="button">Sign in with email instead</button>
    </section>

    <!-- Connected -->
    <section id="mainView" hidden>
      <article class="card" id="syncCard" aria-labelledby="syncTitle">
        <div class="card-head">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m19 9 1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9Zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5ZM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15Z"/></svg>
          </span>
          <div class="card-titles">
            <h2 id="syncTitle">Automatic capture</h2>
            <p id="syncSummary" class="muted"></p>
          </div>
        </div>

        <div id="syncProgress" class="progress-block" hidden>
          <div class="bar" role="progressbar" aria-label="Capture progress" aria-valuemin="0" aria-valuemax="100" id="syncBarWrap">
            <div class="bar-fill" id="syncBar"></div>
          </div>
          <p id="syncCurrent" class="muted ellipsis"></p>
          <ul id="syncCourses" class="mini-courses"></ul>
        </div>

        <div id="syncActions" class="actions"></div>

        <label class="switch-row" for="autoSync">
          <span>
            <span class="switch-label">Check for new lessons daily</span>
            <span class="muted small">While Chrome is open</span>
          </span>
          <input id="autoSync" type="checkbox" role="switch" class="switch">
        </label>
      </article>

      <article class="card" id="pageCard" hidden aria-labelledby="pageTitle">
        <div class="card-head">
          <span id="pageType" class="type-chip"></span>
          <div class="card-titles">
            <h2 id="pageTitle" class="clamp-2"></h2>
            <p id="pageMeta" class="muted"></p>
          </div>
        </div>
        <p id="pageCaptured" class="captured-note" hidden>✓ Already in Askly. Capturing again refreshes it.</p>
        <div class="actions">
          <button id="captureBtn" class="btn btn-primary btn-block" type="button">Capture this page</button>
        </div>
        <details id="pageDetails" class="details">
          <summary>Edit details</summary>
          <div class="field">
            <label for="courseCode">Course code</label>
            <input id="courseCode" type="text" placeholder="e.g. COS409" autocomplete="off">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="weekNumber">Week</label>
              <input id="weekNumber" type="number" min="0" max="60" placeholder="—">
            </div>
            <div class="field grow">
              <label for="pdfSelect">PDF</label>
              <select id="pdfSelect" disabled></select>
            </div>
          </div>
          <div class="field">
            <label for="lessonTitle">Title</label>
            <input id="lessonTitle" type="text">
          </div>
        </details>
        <p id="pageMsg" class="msg" role="status" hidden></p>
      </article>

      <article class="card subtle" id="hintCard" hidden>
        <p id="hintText" class="muted"></p>
      </article>

      <article class="card" id="recentCard" aria-labelledby="recentTitle">
        <div class="card-head row-between">
          <h2 id="recentTitle">Recent captures</h2>
          <span id="recentCount" class="muted small"></span>
        </div>
        <ul id="recentList" class="recent" aria-live="polite"></ul>
      </article>
    </section>
  </main>

  <footer class="bottom">
    <button id="openAskly" class="btn btn-ghost btn-block" type="button">
      Open Askly Capture
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7ZM19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7Z"/></svg>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
