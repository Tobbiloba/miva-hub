# Render Blueprint for MIVA MCP Services
# Deploy all 3 Python services at once

services:
  # MCP Server
  - type: web
    name: miva-mcp-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/mcp/server_clean.py --transport sse --host 0.0.0.0 --port 8080
    envVars:
      - key: PORT
        value: 8080
      - key: POSTGRES_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Shared with the frontend's MCP_SHARED_SECRET (X-MCP-Secret header)
      - key: MCP_SHARED_SECRET
        sync: false
      # Read by src/core/study_buddy_client.py (scheme added if missing)
      - key: STUDY_BUDDY_API_URL
        fromService:
          type: web
          name: miva-study-buddy-api
          property: hostport
      # Must match the Study Buddy API's STUDY_BUDDY_SHARED_SECRET
      - key: STUDY_BUDDY_SHARED_SECRET
        sync: false
      - key: CONTENT_PROCESSOR_API_BASE
        fromService:
          type: web
          name: miva-content-processor-api
          property: host

  # Study Buddy API
  - type: web
    name: miva-study-buddy-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/api/study_buddy_api.py
    envVars:
      - key: PORT
        value: 8083
      - key: STUDY_BUDDY_RELOAD
        value: "false"
      # Required: X-Internal-Secret expected from the frontend proxy + MCP server
      - key: STUDY_BUDDY_SHARED_SECRET
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Content Processor API
  - type: web
    name: miva-content-processor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/api/enhanced_content_processor_api.py
    envVars:
      - key: PORT
        value: 8082
      - key: CONTENT_PROCESSOR_SHARED_SECRET
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

